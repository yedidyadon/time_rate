<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Heartbeat Music Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d11;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script>
let appState = "START"; // START, MEASURING, PLAYING
let capture;
let song;
let fft;
let amplitude;

// משתני מדידה (PPG אמיתי)
let rValues = [];
let lastBeatTime = 0;
let bpm = 75; 
let measurementProgress = 0; 
let measurementDuration = 360; // כ-6 שניות מדידה ב-60fps
let rawBpmList = [];
let hasCamError = false;

// חווית משתמש ואנימציה
let touchCircleRadius = 0;
let touchX = 0;
let touchY = 0;
let isTouching = false;
let pulseScale = 1;
let volHistory = new Array(120).fill(0);

function preload() {
    soundFormats('mp3', 'ogg');
    // טעינת השיר. אם השיר חסר, מנגנון הגיבוי ימנע קריסה
    song = loadSound('song.mp3', 
        () => console.log("השיר נטען"), 
        () => console.log("קובץ song.mp3 לא נמצא, נשתמש בסינתיסייזר מובנה")
    );
}

function setup() {
    createCanvas(windowWidth, windowHeight);
    frameRate(60);
    
    fft = new p5.FFT(0.7, 64); 
    amplitude = new p5.Amplitude(0.85); // החלקה גבוהה מונעת מהגרף להיות רגיש מדי
}

function draw() {
    background(13, 13, 17);

    if (appState === "START") {
        drawStartScreen();
    } else if (appState === "MEASURING") {
        runRealHeartRateMeasurement();
        drawMeasurementScreen();
    } else if (appState === "PLAYING") {
        drawPlayerScreen();
    }
}

// === 1. מסך פתיחה נקי ומינימליסטי ===
function drawStartScreen() {
    textAlign(CENTER, CENTER);
    fill(255);
    textSize(26);
    text("חוויית טיימליין דופק", width / 2, height / 2 - 60);
    
    textSize(14);
    fill(140);
    text("הצמדת האצבע למצלמה תתאים את קצב\nהתקדמות השיר לפעימות הלב שלך.", width / 2, height / 2);

    // כפתור מעוצב
    fill(235, 64, 52);
    rectMode(CENTER);
    rect(width / 2, height / 2 + 100, 220, 55, 28);
    
    fill(255);
    textSize(16);
    text("התחל מדידה אמיתית", width / 2, height / 2 + 100);
}

// === 2. הפעלת חומרה (מצלמה אחורית + פלאש) ===
function initMobileCamera() {
    let constraints = {
        video: {
            facingMode: "environment", // דורש מצלמה אחורית בנייד (איפה שהפלאש נמצא)
            width: { ideal: 160 },
            height: { ideal: 120 }
        },
        audio: false
    };
    
    capture = createCapture(constraints, function(stream) {
        hasCamError = false;
        // ניסיון הדלקת פלאש דרך דפדפן הנייד
        let track = stream.getVideoTracks()[0];
        if (track && typeof track.getCapabilities === 'function') {
            let capabilities = track.getCapabilities();
            if (capabilities.torch) {
                track.applyConstraints({ advanced: [{ torch: true }] }).catch(e => console.log(e));
            }
        }
    });
    capture.hide();
}

// === 3. לוגיקת PPG אמיתית לניתוח פיקסלים ===
function runRealHeartRateMeasurement() {
    if (!capture || !capture.width || capture.width === 0) return;

    capture.loadPixels();
    if (capture.pixels && capture.pixels.length > 0) {
        let totalRed = 0;
        let count = 0;
        
        // דגימת ערוץ ה-Red בלבד מהפיקסלים של המצלמה
        for (let i = 0; i < capture.pixels.length; i += 8) { 
            totalRed += capture.pixels[i];
            count++;
        }
        
        let avgRed = totalRed / count;
        rValues.push(avgRed);
        if (rValues.length > 100) rValues.shift();

        // אלגוריתם זיהוי פיקים (פעימת לב בזמן אמת)
        if (rValues.length > 10) {
            let localAvg = rValues.reduce((a, b) => a + b, 0) / rValues.length;
            let currentV = rValues[rValues.length - 1];
            let prevV = rValues[rValues.length - 2];
            
            if (currentV > localAvg && prevV <= localAvg) {
                let now = millis();
                let timeDiff = now - lastBeatTime;
                if (timeDiff > 450 && timeDiff < 1300) { // טווח הגיוני לדופק אנושי
                    let calculatedBpm = 60000 / timeDiff;
                    rawBpmList.push(calculatedBpm);
                    if (rawBpmList.length > 6) rawBpmList.shift();
                    
                    bpm = Math.round(rawBpmList.reduce((a, b) => a + b, 0) / rawBpmList.length);
                }
                lastBeatTime = now;
            }
        }
    }

    measurementProgress++;
    
    // סיום המדידה ומעבר לנגן
    if (measurementProgress >= measurementDuration) {
        if(capture.srcObject) {
            let tracks = capture.srcObject.getTracks();
            tracks.forEach(track => track.stop()); // כיבוי חומרה כדי לא לבזבז סוללה
        }
        appState = "PLAYING";
        
        if (song && song.isLoaded()) {
            // שינוי מהירות השיר ביחס לקצב הלב שנמדד
            let targetRate = map(bpm, 60, 110, 0.75, 1.3, true);
            song.rate(targetRate);
            song.loop();
        }
    }
}

// === 4. מסך המדידה (UI הכולל פריוויו) ===
function drawMeasurementScreen() {
    // פריוויו קטן של המצלמה במרכז למעלה
    push();
    translate(width / 2, height / 4);
    if (capture && capture.width > 0) {
        imageMode(CENTER);
        // מציג פריוויו מרובע קטן כדי לראות שהאור האדום של האצבע עובד
        image(capture, 0, 0, 110, 110); 
    }
    noFill();
    stroke(235, 64, 52);
    strokeWeight(3);
    rect(0, 0, 110, 110, 22);
    pop();

    textAlign(CENTER, CENTER);
    fill(255);
    textSize(16);
    text("הנח אצבע על המצלמה האחורית והפלאש", width / 2, height / 2 - 30);
    
    // מספרים רצים של הדופק
    textSize(68);
    fill(235, 64, 52);
    text(bpm, width / 2, height / 2 + 50);
    
    textSize(13);
    fill(130);
    text("מד דופק בזמן אמת (BPM)", width / 2, height / 2 + 100);

    // עיגול התקדמות (Loading) מסביב למספר
    let circleSize = 150;
    noFill();
    stroke(30);
    strokeWeight(5);
    ellipse(width / 2, height / 2 + 50, circleSize, circleSize);
    
    stroke(235, 64, 52);
    let endAngle = map(measurementProgress, 0, measurementDuration, 0, TWO_PI);
    arc(width / 2, height / 2 + 50, circleSize, circleSize, -HALF_PI, endAngle - HALF_PI);
}

// === 5. מסך הנגן הראשי (מוניטור + טיימליין פעימות) ===
function drawPlayerScreen() {
    let beatInterval = 60000 / bpm; 
    let currentBeatProgress = (millis() % beatInterval) / beatInterval;
    pulseScale = 1 + sin(currentBeatProgress * TWO_PI) * 0.04;

    textAlign(CENTER);
    fill(140);
    textSize(13);
    text("חוויית סאונד מותאמת דופק", width / 2, 60);
    
    fill(255);
    textSize(32);
    push();
    translate(width / 2, 110);
    scale(pulseScale);
    text(bpm + " BPM", 0, 0);
    pop();

    drawHospitalMonitor(); // גרף דציבלים מרוסן ומדויק
    drawBeatsTimeline();   // טיימליין לפי פעימות לב

    if (isTouching) {
        drawTouchPulse();   // עיגול גדל וקטן סביב הלחיצה
    }
}

// גרף מוניטור בית חולים מדויק (לא רגיש מדי)
function drawHospitalMonitor() {
    let level = amplitude.getLevel(); 
    
    // נורמליזציה קשיחה שמונעת מהקו לקפוץ לתקרה ומחליקה אותו כמו גל רפואי
    let targetY = map(level, 0, 0.4, 5, 95, true);
    volHistory.push(targetY);
    if (volHistory.length > width / 3) volHistory.shift();

    stroke(52, 235, 122); // ירוק אלקטרוני של בית חולים
    strokeWeight(2.5);
    noFill();
    
    push();
    translate(0, height / 2 + 40); 
    beginShape();
    for (let i = 0; i < volHistory.length; i++) {
        let x = map(i, 0, volHistory.length - 1, 0, width);
        let y = -volHistory[i];
        vertex(x, y);
    }
    endShape();
    pop();
}

// טיימליין מבוסס פעימות לב
function drawBeatsTimeline() {
    let timelineY = height - 140;
    let padding = 40;

    let durationSec = song && song.isLoaded() ? song.duration() : 180; 
    let currentSec = song && song.isPlaying() ? song.currentTime() : (millis() / 1000) % durationSec;
    
    // המרת הזמן לפעימות לב במקום שניות
    let totalBeats = Math.round((durationSec * bpm) / 60);
    let currentBeat = Math.round((currentSec * bpm) / 60);

    stroke(35);
    strokeWeight(4);
    line(padding, timelineY, width - padding, timelineY);

    let progressX = map(currentBeat, 0, totalBeats, padding, width - padding);
    stroke(235, 64, 52); 
    line(padding, timelineY, progressX, timelineY);

    noStroke();
    fill(235, 64, 52);
    ellipse(progressX, timelineY, 12 * pulseScale, 12 * pulseScale);

    textAlign(RIGHT);
    textSize(12);
    fill(110);
    text(currentBeat + " פעימות", width - padding, timelineY + 25);
    
    textAlign(LEFT);
    text("אורך לפי ביטים: " + totalBeats, padding, timelineY + 25);
}

// אנימציית לחיצה על המסך לפי הדופק
function drawTouchPulse() {
    let baseRadius = 55;
    touchCircleRadius = baseRadius * pulseScale;

    noFill();
    stroke(255, 255, 255, 130); 
    strokeWeight(2);
    ellipse(touchX, touchY, touchCircleRadius * 1.4, touchCircleRadius * 1.4);
}

function mousePressed() {
    if (appState === "START") {
        userStartAudio(); 
        initMobileCamera();
        appState = "MEASURING";
    } else if (appState === "PLAYING") {
        touchX = mouseX;
        touchY = mouseY;
        isTouching = true;
    }
    return false; 
}

function mouseReleased() {
    isTouching = false;
    return false;
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
}
</script>

</body>
</html>
